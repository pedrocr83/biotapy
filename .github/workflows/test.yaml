name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Get the test environment from hatch as defined in pyproject.toml.
  # This ensures that the pyproject.toml is the single point of truth for test definitions and the same tests are
  # run locally and on continuous integration.
  # Check [[tool.hatch.envs.hatch-test.matrix]] in pyproject.toml and https://hatch.pypa.io/latest/environment/ for
  # more details.
  get-environments:
    runs-on: ubuntu-slim
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Get test environments
        id: get-envs
        run: |
          ENVS_JSON=$(uvx hatch env show --json | jq -c 'to_entries
            | map(
                select(.key | startswith("hatch-test"))
                | {
                    name: .key,
                    label: (if (.key | contains("pre")) then .key + " (PRE-RELEASE DEPENDENCIES)" else .key end),
                    python: .value.python
                  }
              )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  # Run tests through hatch. Spawns a separate runner for each environment defined in the hatch matrix obtained above.
  test:
    needs: get-environments
    permissions:
       id-token: write  # for codecov OIDC
       contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}

    name: ${{ matrix.env.label }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # steps use POSIX syntax; Windows defaults to PowerShell
    continue-on-error: ${{ contains(matrix.env.name, 'pre') }}  # make "all-green" pass even if pre-release job fails

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.env.python }}
      - name: create hatch environment
        run: uvx hatch env create ${{ matrix.env.name }}
      - name: list all all installed package versions
        run: uvx hatch run ${{ matrix.env.name }}:uv pip list
      - name: run tests using hatch
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: uvx hatch run ${{ matrix.env.name }}:run-cov -v --color=yes -n auto
      - name: generate coverage report
        run: |
          # See https://coverage.readthedocs.io/page/config.html#run-patch
          test -f .coverage || uvx hatch run ${{ matrix.env.name }}:cov-combine
          uvx hatch run ${{ matrix.env.name }}:cov-report   # report visibly
          uvx hatch run ${{ matrix.env.name }}:coverage xml # create report for upload
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          use_oidc: true

  # The rules.md gate: ruff (lint, format, size limits, tree-import bans), mypy --strict,
  # import-linter layers, pyproject-fmt, zizmor. Same hooks as local prek (rules.md R14).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run all prek hooks
        run: uvx prek run --all-files --show-diff-on-failure
      # Imports and discovers the asv suite without running it (docs/performance.md), so an API
      # change that breaks a benchmark module fails here; asv check needs no machine file.
      - name: Import the asv benchmarks
        working-directory: benchmarks
        run: uv run --group dev asv check --python=same

  # Optional dependencies must be imported lazily (decisions/optional-heavy-dependencies):
  # importing with runtime dependencies only catches a module-level import of an extra.
  import-without-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Import every biotapy module with runtime dependencies only
        run: >-
          uv run --no-dev python -c "import importlib, pkgutil, biotapy;
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(biotapy.__path__, 'biotapy.')]"

  # Downloads GlobalPatterns/enterotype through pooch and runs the network and golden
  # tests against them (stage2-constraints); the pooch cache is keyed on the loader so a
  # pin bump busts it.
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Cache pooch downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pooch
          key: pooch-${{ hashFiles('src/biotapy/datasets/_remote.py') }}
      - name: Run network and golden tests
        env:
          BIOTAPY_DATA_DIR: ${{ github.workspace }}/.pooch
        run: uv run --group test pytest -m "network or golden"

  # Runs the R bridge tests (marker r, decisions/r-bridge-before-ports): R 4.5.3 with Bioconductor 3.22's ALDEx2 and
  # maaslin3, as tests/r/Dockerfile pins them, on CRAN's snapshot of that image, so the seed-matched goldens hold. The
  # four-method consensus reads GlobalPatterns through the network job's pooch cache.
  r-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.5.3"
          use-public-rspm: false
          cran: https://p3m.dev/cran/__linux__/noble/2026-04-23
      - name: Install ALDEx2 and maaslin3
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: bioc::ALDEx2, bioc::maaslin3
          dependencies: '"hard"'
      # Not asserted: Bioconductor 3.22 fixes the release line and the seed-matched goldens catch result drift; the log shows
      # which versions ran.
      - name: Log the R and package versions
        run: Rscript -e 'cat(R.version.string, "\n"); for (pkg in c("ALDEx2", "maaslin3")) cat(pkg, as.character(packageVersion(pkg)), "\n")'
      # rpy2 builds against R's link flags; without these headers it silently falls back to a mode that cannot load R.
      - name: Install the libraries rpy2 links R with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev libdeflate-dev libzstd-dev liblzma-dev libbz2-dev libicu-dev
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Cache pooch downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pooch
          key: pooch-${{ hashFiles('src/biotapy/datasets/_remote.py') }}
      # Syncs the environment, so this is where rpy2 builds; the tests step reuses it.
      - name: Log the rpy2 version
        env:
          RPY2_CFFI_MODE: API
        run: uv run --group test --extra r python -c "import importlib.metadata as m; print('rpy2', m.version('rpy2'))"
      - name: Run the R bridge tests
        env:
          BIOTAPY_DATA_DIR: ${{ github.workspace }}/.pooch
          # Fail the rpy2 build instead of falling back to its ABI mode.
          RPY2_CFFI_MODE: API
        run: uv run --group test --extra r pytest -m r

  # Runs the tests that need PyTorch (marker torch, extra torch), which every other job deselects; uv installs torch's
  # CPU wheel from PyTorch's index ([tool.uv] in pyproject.toml, decisions/optional-heavy-dependencies).
  ml-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      # Syncs the environment, so the install shows apart from the tests in the job log.
      - name: Log the torch version
        run: uv run --group test --extra torch python -c "import torch; print('torch', torch.__version__)"
      - name: Run the PyTorch tests
        run: uv run --group test --extra torch pytest -m torch

  # Builds the docs as Read the Docs does, executing every notebook (Phase 1 exit gate): the
  # phyloseq vignette downloads GlobalPatterns, enterotype and esophagus through the network
  # job's pooch cache.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Cache pooch downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pooch
          key: pooch-${{ hashFiles('src/biotapy/datasets/_remote.py') }}
      - name: Build the docs, executing every notebook
        env:
          BIOTAPY_DATA_DIR: ${{ github.workspace }}/.pooch
        run: uvx hatch run docs:build

  # Informational: lists knowledge concepts whose code changed in this PR (playbooks/maintain-knowledge).
  # Flagged concepts go to the job summary; the job fails only when the script cannot diff (exit 2).
  knowledge-touched:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Report concepts covering changed code
        env:
          BASE: ${{ github.base_ref }}
        run: |
          status=0
          bash scripts/knowledge_stale.sh --touched --against "origin/$BASE" > knowledge-report.txt || status=$?
          { echo "### Knowledge concepts to review"; echo '```'; cat knowledge-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$status" -le 1

  # Check that all tests defined above pass. This makes it easy to set a single "required" test in branch
  # protection instead of having to update it frequently. See https://github.com/re-actors/alls-green#why.
  check:
    name: Tests pass in all hatch environments
    if: always()
    needs:
      - get-environments
      - test
      - lint
      - import-without-extras
      - network
      - r-bridge
      - ml-extras
      - docs
    runs-on: ubuntu-latest
    steps:
        - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
          with:
            jobs: ${{ toJSON(needs) }}
